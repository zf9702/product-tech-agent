{% extends "base.html" %}
{% block title %}批量上传 - 产品技术资料管理系统{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-cloud-upload"></i> 批量上传</h4>

<!-- 公共参数 -->
<div class="card shadow-sm mb-3">
    <div class="card-header bg-white fw-bold">公共参数（应用于所有文件）</div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <label class="form-label small">产品型号</label>
                <input type="text" id="batch_product" class="form-control form-control-sm" placeholder="如 BY-6B">
            </div>
            <div class="col-md-3">
                <label class="form-label small">文件类型</label>
                <select id="batch_type" class="form-select form-select-sm">
                    <option value="">-- 选择 --</option>
                    {% for rule in rules %}
                    <option value="{{ rule.type_code }}">{{ rule.type_code }} - {{ rule.type_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">文档分类</label>
                <div class="input-group input-group-sm">
                    <select id="batch_category" class="form-select">
                        <option value="">未分类</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" class="btn btn-outline-primary" onclick="showAddCat()" title="添加分类">
                        <i class="bi bi-plus"></i>
                    </button>
                </div>
                <div id="add_cat_row" class="input-group input-group-sm mt-1" style="display:none;">
                    <input type="text" id="new_cat_name" class="form-control" placeholder="新分类名">
                    <button type="button" class="btn btn-sm btn-success" onclick="addCat()">确定</button>
                    <button type="button" class="btn btn-sm btn-secondary" onclick="hideAddCat()">取消</button>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label small">访问级别</label>
                <select id="batch_access" class="form-select form-select-sm">
                    <option value="public">公开</option>
                    <option value="internal">内部</option>
                    <option value="confidential">机密</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- 文件选择区 -->
<div class="card shadow-sm mb-3">
    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
        <span>选择文件</span>
        <span class="badge bg-primary" id="file_count">0 个文件</span>
    </div>
    <div class="card-body">
        <div id="drop_zone" class="border border-2 border-dashed rounded p-4 text-center mb-3"
             style="border-color: #3498db; cursor: pointer; min-height: 120px;"
             onclick="document.getElementById('file_input').click()">
            <i class="bi bi-cloud-arrow-up" style="font-size: 2rem; color: #3498db;"></i>
            <p class="mb-0 mt-2">点击选择文件 或 拖拽文件到此处</p>
            <p class="text-muted small mb-0">支持多选，每次最多 50 个文件</p>
        </div>
        <input type="file" id="file_input" multiple style="display:none;"
               accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.dwg,.dxf,.png,.jpg,.jpeg,.zip,.rar,.7z,.xml,.json,.csv">

        <!-- 文件列表 -->
        <div id="file_list" style="display:none;">
            <table class="table table-sm table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width:30px;"><input type="checkbox" id="check_all" checked></th>
                        <th>文件名</th>
                        <th style="width:100px;">大小</th>
                        <th style="width:180px;">标题（可修改）</th>
                        <th style="width:150px;">文件编号（自动生成）</th>
                        <th style="width:60px;">状态</th>
                    </tr>
                </thead>
                <tbody id="file_tbody"></tbody>
            </table>
            <div class="mt-3 d-flex gap-2">
                <button type="button" class="btn btn-primary" onclick="startUpload()" id="btn_upload">
                    <i class="bi bi-cloud-upload"></i> 开始批量上传
                </button>
                <button type="button" class="btn btn-outline-secondary" onclick="clearFiles()">
                    <i class="bi bi-x-circle"></i> 清空
                </button>
                <span id="upload_progress" class="align-self-center text-muted"></span>
            </div>
        </div>
    </div>
</div>

<!-- 上传结果 -->
<div id="upload_result" class="card shadow-sm" style="display:none;">
    <div class="card-header bg-white fw-bold">上传结果</div>
    <div class="card-body" id="result_body"></div>
</div>

<script>
var selectedFiles = [];

// 拖拽支持
var dz = document.getElementById('drop_zone');
dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.style.background = '#e8f4fd'; });
dz.addEventListener('dragleave', function(e) { dz.style.background = ''; });
dz.addEventListener('drop', function(e) {
    e.preventDefault(); dz.style.background = '';
    addFiles(e.dataTransfer.files);
});

document.getElementById('file_input').addEventListener('change', function(e) {
    addFiles(e.target.files);
    e.target.value = '';
});

document.getElementById('check_all').addEventListener('change', function(e) {
    document.querySelectorAll('.file_check').forEach(function(cb) { cb.checked = e.target.checked; });
});

function addFiles(fileList) {
    for (var i = 0; i < fileList.length && selectedFiles.length < 50; i++) {
        var f = fileList[i];
        // Dedup
        var dup = false;
        for (var j = 0; j < selectedFiles.length; j++) {
            if (selectedFiles[j].name === f.name && selectedFiles[j].size === f.size) { dup = true; break; }
        }
        if (!dup) selectedFiles.push(f);
    }
    renderFileList();
}

function renderFileList() {
    var tbody = document.getElementById('file_tbody');
    tbody.innerHTML = '';
    for (var i = 0; i < selectedFiles.length; i++) {
        var f = selectedFiles[i];
        var nameNoExt = f.name.replace(/\.[^.]+$/, '');
        var size = f.size < 1024 ? f.size + ' B' : f.size < 1048576 ? (f.size/1024).toFixed(1) + ' KB' : (f.size/1048576).toFixed(1) + ' MB';
        tbody.innerHTML += '<tr id="row_' + i + '">' +
            '<td><input type="checkbox" class="file_check" checked data-idx="' + i + '"></td>' +
            '<td><small>' + f.name + '</small></td>' +
            '<td><small>' + size + '</small></td>' +
            '<td><input type="text" class="form-control form-control-sm file_title" data-idx="' + i + '" value="' + nameNoExt + '"></td>' +
            '<td><input type="text" class="form-control form-control-sm file_number" data-idx="' + i + '" placeholder="上传时自动生成"></td>' +
            '<td class="file_status" data-idx="' + i + '"><small class="text-muted">待上传</small></td>' +
            '</tr>';
    }
    document.getElementById('file_count').textContent = selectedFiles.length + ' 个文件';
    document.getElementById('file_list').style.display = selectedFiles.length > 0 ? '' : 'none';
}

function clearFiles() {
    selectedFiles = [];
    renderFileList();
    document.getElementById('upload_result').style.display = 'none';
}

function showAddCat() { document.getElementById('add_cat_row').style.display = 'flex'; document.getElementById('new_cat_name').focus(); }
function hideAddCat() { document.getElementById('add_cat_row').style.display = 'none'; document.getElementById('new_cat_name').value = ''; }
function addCat() {
    var name = document.getElementById('new_cat_name').value.trim();
    if (!name) return;
    var fd = new FormData(); fd.append('name', name);
    fetch('/api/categories/quick-add', {method:'POST', body:fd}).then(function(r){return r.json();}).then(function(d){
        if (d.id) {
            var sel = document.getElementById('batch_category');
            var opt = document.createElement('option'); opt.value = d.id; opt.textContent = name; opt.selected = true;
            sel.appendChild(opt);
            hideAddCat();
        }
    });
}

// 自动生成编号（批量）
function generateAllNumbers() {
    var product = document.getElementById('batch_product').value.trim();
    var typeCode = document.getElementById('batch_type').value;
    if (!product || !typeCode) return;

    var checks = document.querySelectorAll('.file_check:checked');
    var count = 0;
    checks.forEach(function(cb) {
        var idx = cb.getAttribute('data-idx');
        var numInput = document.querySelector('.file_number[data-idx="' + idx + '"]');
        if (!numInput.value) count++;
    });

    if (count === 0) return;

    // Fetch first number, then increment
    fetch('/api/generate-number?product_model=' + encodeURIComponent(product) + '&type_code=' + encodeURIComponent(typeCode))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) return;
            var baseNum = data.doc_number;
            var parts = baseNum.split('-');
            var seqStr = parts[parts.length - 1];
            var seqLen = seqStr.length;
            var baseSeq = parseInt(seqStr);

            var num = 0;
            checks.forEach(function(cb) {
                var idx = cb.getAttribute('data-idx');
                var numInput = document.querySelector('.file_number[data-idx="' + idx + '"]');
                if (!numInput.value) {
                    num++;
                    var seq = String(baseSeq + num - 1);
                    while (seq.length < seqLen) seq = '0' + seq;
                    parts[parts.length - 1] = seq;
                    numInput.value = parts.join('-');
                }
            });
        });
}

// 监听产品型号和类型码变化，自动生成编号
document.getElementById('batch_product').addEventListener('change', generateAllNumbers);
document.getElementById('batch_type').addEventListener('change', generateAllNumbers);

// 开始批量上传
async function startUpload() {
    var product = document.getElementById('batch_product').value.trim();
    var typeCode = document.getElementById('batch_type').value;
    var category = document.getElementById('batch_category').value;
    var access = document.getElementById('batch_access').value;

    if (!product) { alert('请填写产品型号'); return; }

    var btn = document.getElementById('btn_upload');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 上传中...';

    var checks = document.querySelectorAll('.file_check:checked');
    var total = checks.length;
    var done = 0;
    var success = 0;
    var fail = 0;

    for (var i = 0; i < checks.length; i++) {
        var idx = parseInt(checks[i].getAttribute('data-idx'));
        var file = selectedFiles[idx];
        var titleInput = document.querySelector('.file_title[data-idx="' + idx + '"]');
        var numInput = document.querySelector('.file_number[data-idx="' + idx + '"]');
        var statusCell = document.querySelector('.file_status[data-idx="' + idx + '"]');

        statusCell.innerHTML = '<small class="text-primary"><span class="spinner-border spinner-border-sm"></span></small>';

        var fd = new FormData();
        fd.append('file', file);
        fd.append('title', titleInput.value || file.name);
        fd.append('product_model', product);
        fd.append('doc_number', numInput.value || '');
        fd.append('doc_type_code', typeCode);
        fd.append('version', '1.0');
        fd.append('category_id', category);
        fd.append('new_category', '');
        fd.append('access_level', access);
        fd.append('description', '');

        try {
            var resp = await fetch('/upload', {method: 'POST', body: fd, redirect: 'follow'});
            if (resp.ok && resp.url.indexOf('/documents') !== -1) {
                statusCell.innerHTML = '<small class="text-success"><i class="bi bi-check-circle"></i></small>';
                success++;
            } else {
                var txt = await resp.text();
                statusCell.innerHTML = '<small class="text-danger" title="' + txt.substring(0,50).replace(/"/g,'') + '"><i class="bi bi-x-circle"></i></small>';
                fail++;
            }
        } catch(e) {
            statusCell.innerHTML = '<small class="text-danger"><i class="bi bi-x-circle"></i></small>';
            fail++;
        }
        done++;
        document.getElementById('upload_progress').textContent = done + '/' + total;
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-cloud-upload"></i> 开始批量上传';

    // 显示结果
    var resultDiv = document.getElementById('upload_result');
    resultDiv.style.display = '';
    document.getElementById('result_body').innerHTML =
        '<div class="alert alert-' + (fail === 0 ? 'success' : 'warning') + ' mb-0">' +
        '<i class="bi bi-info-circle"></i> ' +
        '上传完成：成功 <strong>' + success + '</strong> 个' +
        (fail > 0 ? '，失败 <strong>' + fail + '</strong> 个' : '') +
        '</div>' +
        '<a href="/documents" class="btn btn-primary mt-2"><i class="bi bi-file-earmark-text"></i> 查看文档列表</a>';
}
</script>
{% endblock %}
