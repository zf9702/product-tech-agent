{% extends "base.html" %}
{% block title %}上传文档 - 产品技术资料管理系统{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="bi bi-cloud-upload"></i> 上传文档</h4>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post" action="/upload" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label">文档标题 <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label">版本</label>
                        <input type="text" name="version" class="form-control" value="1.0">
                    </div>
                </div>
            </div>

            <!-- 自动编号区域 -->
            <div class="card bg-light mb-3">
                <div class="card-body py-2">
                    <div class="row align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">产品型号</label>
                            <input type="text" name="product_model" id="product_model"
                                   class="form-control form-control-sm" placeholder="如 BY-6B">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">文件类型</label>
                            <select name="doc_type_code" id="doc_type_code" class="form-select form-select-sm">
                                <option value="">-- 选择类型 --</option>
                                {% for rule in rules %}
                                <option value="{{ rule.type_code }}">{{ rule.type_code }} - {{ rule.type_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label class="form-label small fw-bold">&nbsp;</label>
                            <button type="button" class="btn btn-sm btn-outline-primary w-100"
                                    onclick="generateNumber()" title="自动生成编号">
                                <i class="bi bi-magic"></i> 生成
                            </button>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-bold">
                                文件编号
                                <span id="auto_hint" class="text-muted fw-normal" style="font-size:0.75rem;"></span>
                            </label>
                            <div class="input-group input-group-sm">
                                <input type="text" name="doc_number" id="doc_number"
                                       class="form-control" placeholder="点击[生成]自动填入，或手动输入">
                                <button type="button" class="btn btn-outline-secondary" onclick="copyNumber()"
                                        title="复制编号">
                                    <i class="bi bi-clipboard"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <p class="text-muted small mb-0 mt-1">
                        编号格式: 产品型号-类型码-年份-流水号 (如 BY-6B-TD-2026-001)，
                        管理员可在 <a href="/numbering-rules">编号规则</a> 中自定义
                    </p>
                </div>
            </div>

            <!-- 分类 & 权限 -->
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">文档分类</label>
                        <div class="input-group">
                            <select name="category_id" id="category_select" class="form-select">
                                <option value="">未分类</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                            <button type="button" class="btn btn-outline-primary" onclick="showAddCategory()"
                                    title="添加新分类">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                        <!-- 快捷添加分类 -->
                        <div id="add_category_row" class="input-group mt-2" style="display:none;">
                            <input type="text" id="new_category_name" class="form-control form-control-sm"
                                   placeholder="输入新分类名称">
                            <button type="button" class="btn btn-sm btn-success" onclick="addCategory()">确定</button>
                            <button type="button" class="btn btn-sm btn-secondary" onclick="hideAddCategory()">取消</button>
                        </div>
                        <input type="hidden" name="new_category" id="new_category" value="">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">访问级别</label>
                        <select name="access_level" class="form-select">
                            <option value="public">公开 - 所有用户可见</option>
                            <option value="internal">内部 - 仅部门可见</option>
                            <option value="confidential">机密 - 仅管理员可见</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">描述说明</label>
                <textarea name="description" class="form-control" rows="3" placeholder="文档用途、适用范围等"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">选择文件 <span class="text-danger">*</span></label>
                <input type="file" name="file" class="form-control" required>
                <div class="form-text">
                    支持格式: PDF, Word, Excel, PPT, 图片, CAD, 压缩包等 (最大 100MB)
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-cloud-upload"></i> 上传
            </button>
            <a href="/documents" class="btn btn-secondary ms-2">取消</a>
        </form>
    </div>
</div>

<script>
// 自动生成编号
function generateNumber() {
    var product = document.getElementById('product_model').value.trim();
    var typeCode = document.getElementById('doc_type_code').value;
    if (!product) { alert('请先填写产品型号'); return; }
    if (!typeCode) { alert('请先选择文件类型'); return; }

    fetch('/api/generate-number?product_model=' + encodeURIComponent(product) + '&type_code=' + encodeURIComponent(typeCode))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { alert(data.error); return; }
            document.getElementById('doc_number').value = data.doc_number;
            document.getElementById('auto_hint').textContent = data.type_name + ' #' + data.next_seq;
        })
        .catch(function(e) { alert('生成失败: ' + e); });
}

// 复制编号
function copyNumber() {
    var num = document.getElementById('doc_number').value;
    if (!num) { alert('编号为空'); return; }
    navigator.clipboard.writeText(num).then(function() {
        alert('已复制: ' + num);
    });
}

// 显示添加分类输入框
function showAddCategory() {
    document.getElementById('add_category_row').style.display = 'flex';
    document.getElementById('new_category_name').focus();
}

function hideAddCategory() {
    document.getElementById('add_category_row').style.display = 'none';
    document.getElementById('new_category_name').value = '';
}

// AJAX 添加分类
function addCategory() {
    var name = document.getElementById('new_category_name').value.trim();
    if (!name) { alert('请输入分类名称'); return; }

    var formData = new FormData();
    formData.append('name', name);

    fetch('/api/categories/quick-add', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.id) {
                // 添加到下拉框并选中
                var sel = document.getElementById('category_select');
                var opt = document.createElement('option');
                opt.value = data.id;
                opt.textContent = name;
                opt.selected = true;
                sel.appendChild(opt);
                hideAddCategory();
                if (data.existed) {
                    alert('分类 "' + name + '" 已存在，已自动选中');
                }
            }
        })
        .catch(function(e) { alert('添加失败: ' + e); });
}

// 回车添加分类
document.getElementById('new_category_name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addCategory(); }
});
</script>
{% endblock %}
